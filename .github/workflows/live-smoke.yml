name: live DeepInfra smoke test

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type LIVE to authorize one billed US$0.0125 maximum draft request'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deepinfra-paid-smoke
  cancel-in-progress: false

jobs:
  one-paid-draft:
    if: inputs.confirmation == 'LIVE'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEEPINFRA_TOKEN: ${{ secrets.DEEPINFRA_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: pytest -q
      - name: Compile the approved first shot prompt
        run: |
          mkdir -p runs/live-smoke outputs/live-smoke
          video-gen validate-scene > runs/live-smoke/compiled-scene.json
          python - <<'PY'
          import json
          packet = json.load(open('runs/live-smoke/compiled-scene.json'))
          open('runs/live-smoke/prompt.txt', 'w').write(packet['prompts']['s01'] + '\n')
          PY
      - name: Make exactly one confirmed cheap draft request
        run: |
          test -n "$DEEPINFRA_TOKEN"
          video-gen --ledger runs/live-smoke/ledger.sqlite3 plan-video \
            --profile cad_10 --role draft_video --seed 101 \
            --prompt "$(cat runs/live-smoke/prompt.txt)" \
            --scene-audit runs/live-smoke/compiled-scene.json --shot-id s01 \
            --live --confirm-live \
            | tee runs/live-smoke/result.json
      - name: Export audit data
        if: always()
        run: |
          python scripts/export_audit.py \
            --ledger runs/live-smoke/ledger.sqlite3 \
            --outputs outputs --destination runs/live-smoke/audit.json
          if command -v ffprobe >/dev/null; then
            find outputs -type f -name '*.mp4' -print0 | xargs -0 -r -n1 \
              ffprobe -v error -show_format -show_streams -of json \
              > runs/live-smoke/ffprobe.json
          fi
      - name: Persist complete audit packet and generated media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepinfra-live-smoke-${{ github.run_id }}
          path: |
            runs/live-smoke/
            outputs/
          if-no-files-found: error
          retention-days: 30
